.nb.a{background:var(--gold);color:#1A1000;font-weight:700;border-color:var(--gold);}

let cur=null;

function tg(t){
  if(t==='inc')return'<span class="tag ti">כלול</span>';
  if(t==='exp')return'<span class="tag te">תשלום עצמאי</span>';
  if(t==='opt')return'<span class="tag to">אופציונלי</span>';
  if(t==='vip')return'<span class="tag tv">VIP</span>';
  if(t==='ksh')return'<span class="tag tk">כשר-ידידותי</span>';
  return'';
}

function go(k){
  cur=k;
  render();
  document.getElementById('sc').scrollTop=0;
}

function render(){
  const prg=document.getElementById('prg');
  prg.innerHTML=days.map((d,i)=>`<div class="pd${cur===i?' a':''}" onclick="go(${i})"></div>`).join('');
  const nav=document.getElementById('nav');
  const kStr=k=>k===null?'null':typeof k==='string'?"'"+k+"'":k;
  const items=[{l:'סקירה',k:null},{l:'עלויות',k:'costs'},...days.map((d,i)=>({l:'יום '+d.id,k:i}))];
  nav.innerHTML=items.map(item=>`<button class="nb${cur===item.k?' a':''}" onclick="go(${kStr(item.k)})">${item.l}</button>`).join('');
  const sc=document.getElementById('sc');
  if(cur===null) renderOv(sc);
  else if(cur==='costs') renderCosts(sc);
  else renderDay(sc,days[cur]);
}

function renderDay(sc,d){

        <span class="en">${e.n}</span>
        ${e.tm?`<span class="etime">${e.tm}</span>`:''}
      </div>
      ${e.d?`<div class="ed">${e.d}</div>`:''}
      ${e.l?`<a class="el" href="${e.l}" target="_blank">🔗 ${e.lt||''}</a>`:''}
      ${e.tg&&e.tg.length?`<div class="tags">${e.tg.map(tg).join('')}</div>`:''}
    </div>`).join('');
  sc.innerHTML=`
    <div class="dh">
      <div class="dnr"><div class="dn">${String(d.id).padStart(2,'0')}</div><div class="dt">${d.title}</div></div>
      <div class="dd">${d.date}</div>
      <div class="dl">${d.loc}</div>
    </div>
    <div class="tl">${evs}</div>
    <div class="hb">
      <h4>לינה הלילה</h4>
      <div class="hbn">${d.hotel}</div>
      <div class="hbr">${d.rooms.replace(/\n/g,'<br>')}</div>
      ${d.hl?`<a class="hbl" href="${d.hl}" target="_blank">אתר המלון ←</a>`:''}
    </div>
    <div class="dn2">
      <button class="da" onclick="go(${cur-1})" ${cur<=0?'disabled':''}>← יום ${cur}</button>
      <button class="da" onclick="go(null)">סקירה</button>
      <button class="da" onclick="go(${cur+1})" ${cur>=15?'disabled':''}>יום ${cur+2} →</button>
    </div>`;
}
