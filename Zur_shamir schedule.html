                                            </div>

                                            <div className="relative border-r-2 border-brand-teal/30 mr-4 space-y-6 pr-6">
                                                {day.events.map((event, idx) => (
                                                    <div key={idx} className="relative group">
                                                        <div className="absolute -right-[31px] top-1 w-4 h-4 rounded-full bg-white border-4 border-brand-teal group-hover:scale-125 transition-transform"></div>

                                                        <div className="bg-slate-50 hover:bg-white p-4 rounded-xl border border-slate-100 hover:border-slate-300 transition-all">
                                                            <div className="flex items-center justify-between gap-2 mb-1 flex-wrap">
                                                                <span className="inline-flex items-center gap-1.5 font-bold text-sm text-brand-blue bg-blue-50 px-2.5 py-1 rounded-md">
                                                                    <i className={`fa-solid ${event.icon} text-xs`}></i>
                                                                    {event.time}
                                                                </span>
                                                                {event.link && (
                                                                    <a 
                                                                        href={event.link} 
                                                                        target="_blank" 
                                                                        rel="noopener noreferrer" 
                                                                        className="text-xs text-teal-600 hover:text-teal-800 font-semibold flex items-center gap-1"
                                                                    >
                                                                        <span>קישור לאתר</span>
                                                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                                    </a>
                                                                )}
                                                            </div>

                                                            <h4 className="font-bold text-slate-900 text-base mb-1">{event.title}</h4>
                                                            <p className="text-slate-600 text-sm leading-relaxed">{event.desc}</p>

                                                            {event.hasMenu && (
                                                                <button
                                                                    onClick={() => setActiveTab('menus')}
                                                                    className="mt-3 text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors"
                                                                >
                                                                    <i className="fa-solid fa-utensils text-emerald-600"></i>
                                                                    צפה בתפריט המלא
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                            </div>
                        </div>
                    )}

                    {/* TAB 2: MENUS */}
                    {activeTab === 'menus' && (
                        <div>
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                                <div>
                                    <h2 className="text-xl font-bold text-slate-800">תפריטי הארוחות והמסעדות</h2>
                                    <p className="text-xs text-slate-500">תפריטים מלאים מתורגמים לעברית</p>
                                </div>
                                <div className="relative w-full md:w-60">
                                    <input
                                        type="text"
                                        placeholder="חפש מנה..."
                                        value={menuSearch}
                                        onChange={(e) => setMenuSearch(e.target.value)}
                                        className="w-full text-xs pl-8 pr-3 py-2 bg-white border border-slate-300 rounded-xl focus:outline-none focus:border-brand-blue"
                                    />
                                    <i className="fa-solid fa-search absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
                                </div>
                            </div>

                            <div className="space-y-8">
                                {Object.keys(menus).map((key) => {
                                    const menu = menus[key];
                                    const filteredItems = menu.items.filter(item => 
                                        item.name.toLowerCase().includes(menuSearch.toLowerCase()) || 
                                        item.cat.toLowerCase().includes(menuSearch.toLowerCase())
                                    );

                                    if (filteredItems.length === 0) return null;

                                    return (
                                        <div key={key} className="glass-card rounded-2xl p-6 shadow-sm border border-slate-200">
                                            <div className="border-b border-slate-200 pb-4 mb-4">
                                                <h3 className="text-lg font-bold text-brand-dark">{menu.title}</h3>
                                                <p className="text-xs text-slate-500 mt-1">{menu.subtitle}</p>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                {filteredItems.map((item, idx) => (
                                                    <div key={idx} className="p-3 bg-white border border-slate-100 rounded-xl flex items-center justify-between gap-3 shadow-2xs">
                                                        <span className="font-medium text-sm text-slate-800">{item.name}</span>
                                                        <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full flex-shrink-0">
                                                            {item.cat}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* TAB 3: QUESTIONS & DECISIONS (EXACTLY 5 OPEN ITEMS) */}
                    {activeTab === 'questions' && (
                        <div>
                            <div className="mb-6">
                                <h2 className="text-xl font-bold text-slate-800">נושאים פתוחים לקבוצה (5 נושאים)</h2>
                                <p className="text-xs text-slate-500">פירוט נושאים לאישור והחלטה</p>
                            </div>

                            <div className="space-y-4">
                                {/* Open Item 1: Diving Museum */}
                                <div className="glass-card rounded-2xl p-6 border border-slate-200 shadow-sm">
                                    <div className="space-y-2">
                                        <div className="inline-flex items-center gap-1.5 text-xs font-bold text-teal-800 bg-teal-100 px-2.5 py-0.5 rounded-full">
                                            <i className="fa-solid fa-water"></i> יום 2 - <span dir="ltr">09/09/2026</span>
                                        </div>
                                        <h3 className="text-base font-bold text-slate-900">צלילה למוזיאון התת-ימי (MUSAN)</h3>
                                        <p className="text-xs text-slate-600 leading-relaxed">
                                            האם מעוניינים בצלילה למוזיאון התת ימי ביום של הביץ קלאב (<span dir="ltr">08:00–11:00</span>) ולאחר מכן הצטרפות לביץ קלאב?
                                        </p>
                                    </div>
                                </div>

                                {/* Open Item 2: Dietary Restrictions */}
                                <div className="glass-card rounded-2xl p-6 border border-slate-200 shadow-sm">
                                    <div className="space-y-2">
                                        <div className="inline-flex items-center gap-1.5 text-xs font-bold text-rose-800 bg-rose-100 px-2.5 py-0.5 rounded-full">
                                            <i className="fa-solid fa-utensils"></i> העדפות תזונה
                                        </div>
                                        <h3 className="text-base font-bold text-slate-900">רשימת "Kosher Style" / צמחוני / אלרגיות</h3>
                                        <p className="text-xs text-slate-600 leading-relaxed">
                                            נשמח לקבל העדפות תזונה בהתאם לאלרגיות, צמחונות ורשימת "Kosher Style".
                                        </p>
                                    </div>
                                </div>

                                {/* Open Item 3: Olive Oil Visit (Terra Oliva) */}
                                <div className="glass-card rounded-2xl p-6 border border-slate-200 shadow-sm">
                                    <div className="space-y-2">
                                        <div className="inline-flex items-center gap-1.5 text-xs font-bold text-amber-800 bg-amber-100 px-2.5 py-0.5 rounded-full">
                                            <i className="fa-solid fa-bottle-droplet"></i> יום 3 - <span dir="ltr">10/09/2026</span>
                                        </div>
                                        <h3 className="text-base font-bold text-slate-900">ביקור במפעל שמן זית (TERRA OLIVA)</h3>
                                        <p className="text-xs text-slate-600 leading-relaxed">
                                            לאחר התייעצות עם הספק המקומי, הסיור ב-TERRA OLIVA אינו מתאים לסטנדרט הקבוצה ואף אינו מומלץ בכללי כמקום לביקור.
                                        </p>
                                    </div>
                                </div>

                                {/* Open Item 4: Transport Option */}
                                <div className="glass-card rounded-2xl p-6 border border-slate-200 shadow-sm">
                                    <div className="space-y-2">
                                        <div className="inline-flex items-center gap-1.5 text-xs font-bold text-amber-800 bg-amber-100 px-2.5 py-0.5 rounded-full">
                                            <i className="fa-solid fa-bus"></i> יום 3 - <span dir="ltr">10/09/2026</span>
                                        </div>
                                        <h3 className="text-base font-bold text-slate-900">בחירת התחבורה ביום האחרון בלפקרה</h3>
                                        <p className="text-xs text-slate-600 leading-relaxed">
                                            האם מעוניינים בג׳יפים או באוטובוס ביום האחרון?
                                        </p>
                                    </div>
                                </div>

                                {/* Open Item 5: Seating Map (Pepper & Vassos) */}
                                <div className="glass-card rounded-2xl p-6 border border-slate-200 shadow-sm">
                                    <div className="space-y-2">
                                        <div className="inline-flex items-center gap-1.5 text-xs font-bold text-blue-800 bg-blue-100 px-2.5 py-0.5 rounded-full">
                                            <i className="fa-solid fa-chair"></i> תמונות ומפת ישיבה
                                        </div>
                                        <h3 className="text-base font-bold text-slate-900">תמונות ומפת ישיבה (Pepper Bar Lounge & Vassos)</h3>
                                        <p className="text-xs text-slate-600 leading-relaxed">
                                            ממתינים לקבלת תמונות מעודכנות ומפת ישיבה סופית עבור Pepper Bar Lounge ועבור Vassos.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 4: GIFTS */}
                    {activeTab === 'gifts' && (
                        <div>
                            <div className="glass-card rounded-3xl p-6 md:p-8 bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 shadow-md mb-6">
                                <div className="flex items-center gap-4 mb-4">
                                    <div className="w-12 h-12 rounded-2xl bg-amber-500 text-white flex items-center justify-center text-xl shadow-sm">
                                        <i className="fa-solid fa-gift"></i>
                                    </div>
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-900">מתנת סיום בתוך תיק מעוצב</h2>
                                        <p className="text-xs text-slate-600">כל משתתף מקבל תיק מעוצב עם חמישה ממתקים ומוצרים מסורתיים</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                                    {giftBag.map((item, idx) => (
                                        <div key={idx} className="bg-white p-4 rounded-2xl border border-amber-100 shadow-2xs flex flex-col justify-between">
                                            <div>
                                                <div className="flex items-center justify-between mb-2">
                                                    <i className={`fa-solid ${item.icon} text-amber-600 text-lg`}></i>
                                                    <span className="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">
                                                        {item.weight}
                                                    </span>
                                                </div>
                                                <h3 className="font-bold text-sm text-slate-900 mb-1">{item.name}</h3>
                                                <p className="text-xs text-slate-500">{item.desc}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 5: LINKS */}
                    {activeTab === 'links' && (
                        <div>
                            <div className="mb-6">
                                <h2 className="text-xl font-bold text-slate-800">קישורים ישירים לאתרים ופלטפורמות</h2>
                                <p className="text-xs text-slate-500">לחצי על הכפתורים לפתיחה ישירה של האתרים בחלון חדש</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {[
                                    { title: 'Nissi Blu Beach Resort', cat: 'מלון', link: 'https://nissiblu.com/', icon: 'fa-hotel', desc: 'אתר המלון הרשמי באיה נאפה' },
                                    { title: 'LASMARI Beach Club', cat: 'ביץ\' קלאב', link: 'https://lasmaribeach.com/', icon: 'fa-umbrella-beach', desc: 'אתר הביץ\' קלאב בחוף' },
                                    { title: 'Pepper Bar Lounge', cat: 'בר-לאונג\'', link: 'https://napaplaza.com/pepper-bar-restaurant/', icon: 'fa-martini-glass-citrus', desc: 'אתר הבר-לאונג\' לערב השני' },
                                    { title: 'The Castle Club', cat: 'מועדון', link: 'https://thecastleclub.com/', icon: 'fa-record-vinyl', desc: 'אתר מועדון הלילה The Castle באיה נאפה' },
                                    { title: 'Dafermou Winery', cat: 'יקב', link: 'https://dafermouwinery.com/', icon: 'fa-wine-bottle', desc: 'אתר יקב דפרמו בלפקרה' },
                                    { title: 'Tochni Tavern', cat: 'טברנה', link: 'https://www.tochnitavern.com/', icon: 'fa-utensils', desc: 'אתר מסעדת טוכני טברן' },
                                    { title: 'Maria\'s Restaurant', cat: 'מסעדה', link: 'https://vavatsiniavillage.com/marias-restaurant/', icon: 'fa-utensils', desc: 'אתר מסעדת מריה בבבציניה' }
                                ].map((loc, idx) => (
                                    <div key={idx} className="glass-card p-4 rounded-2xl border border-slate-200 flex items-center justify-between hover:shadow-md transition-all">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-xl bg-slate-100 text-brand-navy flex items-center justify-center">
                                                <i className={`fa-solid ${loc.icon}`}></i>
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-sm text-slate-900">{loc.title}</h3>
                                                <p className="text-xs text-slate-500">{loc.desc}</p>
                                            </div>
                                        </div>
                                        <a
                                            href={loc.link}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="px-3.5 py-2 bg-brand-navy hover:bg-slate-800 text-white text-xs font-bold rounded-xl transition-colors flex items-center gap-1.5"
                                        >
                                            <span>מעבר לאתר</span>
                                            <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                        </a>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
